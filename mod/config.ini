[menu]
title=永动接线器

[field.show_ping]
type=bool
label=显示网络延迟
description=控制左下角延迟与网络信号图标的显示。
default=true

[field.ping_format]
type=string
label=延迟显示文字
description=延迟文字显示模板，{ping} 会替换为当前延迟数值。
max_length=128
default={ping}ms

[field.show_uid]
type=bool
label=显示 UID
description=控制左下角 UID 文字的显示。
default=true

[field.uid_format]
type=string
label=UID 显示文字
description=UID 文字显示模板，{uid} 会替换为当前 UID。
max_length=128
default=UID: {uid}
